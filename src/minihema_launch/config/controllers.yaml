controller_manager: # Node name
  ros__parameters:
    update_rate: 20 # Has to be an integer otherwise errors are encountered

    diff_controller:
      type: diff_drive_controller/DiffDriveController

    joint_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster 


diff_controller:
  ros__parameters:
    
    publish_rate: 20.0 # Has to be a double otherwise errors are encountered

    base_frame_id: base_footprint

    left_wheel_names: ['right_wheel_joint']
    right_wheel_names: ['left_wheel_joint']
    wheel_separation: 0.169
    wheel_radius: 0.040

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.22 

    # Obtained from https://wiki.ros.org/diff_drive_controller
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 1000.0] 

    # Whether the input has a time stamp or not
    use_stamped_vel: false

    # Odometry fused with IMU is published by robot_localization, so no need to publish a TF
    # based on encoders alone (https://wiki.ros.org/diff_drive_controller)
    enable_odom_tf: false

imu_broadcaster:
  ros__parameters:

    sensor_name: mpu6050
    frame_id: imu_link

    # 500 data points used to calculate covariances
    static_covariance_orientation: [3.14547e-11, 0.0, 0.0, 1.74432e-11, 0.0, 0.0, 0.00342877, 0.0, 0.0]
    static_covariance_angular_velocity: [8.58032e-09, 0.0, 0.0, 1.39056e-17, 0.0, 0.0, 2.33753e-14, 0.0, 0.0]
    static_covariance_linear_acceleration: [9.43424e-06, 0.0, 0.0, 3.85032e-09, 0.0, 0.0, 2.37034e-09, 0.0, 0.0]
