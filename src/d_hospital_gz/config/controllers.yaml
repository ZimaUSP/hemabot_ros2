controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    diff_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Values taken from d_hospital_gz_core.xacro.
    wheel_separation: 0.13
    wheel_radius: 0.0325
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint
    tf_frame_prefix: "~"
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]

    position_feedback: true
    open_loop: false
    enable_odom_tf: true
    cmd_vel_timeout: 0.5

    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    linear.x.max_deceleration: -1.0
    linear.x.max_acceleration_reverse: -1.0
    linear.x.max_deceleration_reverse: 1.0

    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
    angular.z.max_acceleration: 3.0
    angular.z.max_deceleration: -3.0
    angular.z.max_acceleration_reverse: -3.0
    angular.z.max_deceleration_reverse: 3.0
