# Interface velocity; comando /wheel_controller/commands em rad/s.
# Ordem de Float64MultiArray.data: [left_wheel_joint, right_wheel_joint].
controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

wheel_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - left_wheel_joint
      - right_wheel_joint
