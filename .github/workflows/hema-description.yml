name: Hema CAD description
on:
  push:
    paths: ['src/hema_description/**', '.github/workflows/hema-description.yml']
  pull_request:
    paths: ['src/hema_description/**', '.github/workflows/hema-description.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xacro:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install xacro==2.1.1 PyYAML numpy
      - run: python src/hema_description/scripts/validate_description.py
